name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # One job per KMI, built inside the matching DDK container.
  # android12-5.10 is listed so it can be attempted, but its kernel tree is not
  # clang-buildable here; failing that single job does not block packaging.
  lkm:
    name: hma_uidfake.ko (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-20260828
      options: --privileged
    continue-on-error: ${{ matrix.kmi == 'android12-5.10' }}
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          KDIR="${KDIR:-/opt/ddk/kdir/${{ matrix.kmi }}}"
          [ -f "$KDIR/Makefile" ] || { echo "no kernel tree at $KDIR"; exit 1; }

          # kbuild writes objects into the M= directory, so build from a stage dir
          # that only contains symlinks to src/ to keep the checkout clean.
          stage="$RUNNER_TEMP/stage/${{ matrix.kmi }}"
          mkdir -p "$stage" out
          for f in src/*; do ln -sfn "$PWD/$f" "$stage/$(basename "$f")"; done

          make -C "$KDIR" ARCH=arm64 LLVM=1 M="$stage" modules
          llvm-strip -d "$stage/hma_uidfake.ko" || true
          cp "$stage/hma_uidfake.ko" "out/${{ matrix.kmi }}_arm64_hma_uidfake.ko"
      - uses: actions/upload-artifact@v4
        with:
          name: ko-${{ matrix.kmi }}
          path: out/*.ko
          if-no-files-found: error

  pack:
    name: pack module zip
    runs-on: ubuntu-latest
    needs: lkm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build/ko
          pattern: ko-*
          merge-multiple: true
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          # Do not reuse a partially restored NDK archive; the local cache can
          # contain source.properties while missing the LLVM toolchain.
          local-cache: false
      - name: Validate NDK toolchain
        run: |
          set -euo pipefail
          ndk="${{ steps.ndk.outputs.ndk-path }}"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DUG_NDK="${{ steps.ndk.outputs.ndk-path }}" \
            -DUG_USE_PREBUILT_KO=ON
      - name: Build and pack
        run: |
          set -euo pipefail
          cmake --build build -j"$(nproc)"
          ls -la build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: build/dist/*.zip

  release:
    name: attach to release
    runs-on: ubuntu-latest
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: module-zip
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
